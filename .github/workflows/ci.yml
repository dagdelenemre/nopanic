name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job needs anything beyond reading the repo.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: mypy src
      - name: type-check the add-on packages
        run: |
          pip install -e packages/nopanic-otel -e packages/nopanic-redis
          mypy --strict --python-version 3.10 packages/nopanic-otel/src packages/nopanic-redis/src

  # The add-on packages, tested against the core in this checkout.
  otel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . -e "packages/nopanic-otel[dev]"
      - run: pytest -q packages/nopanic-otel/tests

  redis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 15
    env:
      # Also run every test against a real server, not only fakeredis.
      NOPANIC_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . -e "packages/nopanic-redis[dev]"
      - run: pytest -q packages/nopanic-redis/tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt -e .
      - run: mkdocs build --strict

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .[dev] pip-audit
      - run: pip-audit  # zero runtime deps; audits the dev toolchain

  # Asserts are stripped under `python -O`; library code must not rely on them.
  optimized-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -O -c "import nopanic; print(nopanic.__version__)"

  # Test the BUILT wheel in a clean env, not the editable install, so
  # packaging defects and import shadowing cannot hide behind `pip install -e`.
  packaged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build pytest
      - run: python -m build --wheel
      - name: install the wheel and run the suite against it
        run: |
          pip install dist/*.whl
          python -c "import nopanic; assert 'site-packages' in nopanic.__file__, nopanic.__file__"
          pytest tests -q
